<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 820" role="img"><rect width="660" height="820" rx="20" fill="#f3f6fa"/><style>text{font-family:Arial,sans-serif;fill:#192d42} .h{font-size:25px;font-weight:700}.b{font-size:20px}.s{font-size:17px}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#506782" stroke-width="1.5"/></marker></defs><text x="34" y="48" class="h">Three records, three purposes</text><text x="34" y="79" class="s">PROPOSED HANDOFF AND RECOVERY DESIGN</text><rect x="34" y="120" width="592" height="175" rx="14" fill="#fff" stroke="#c5d1de"/><text x="56" y="160" class="h">01  Task contract</text><text x="56" y="200" class="b">What are we trying to achieve?</text><text x="56" y="231" class="b">Scope, owners, success criteria, limits.</text><rect x="34" y="330" width="592" height="175" rx="14" fill="#fff" stroke="#c5d1de"/><text x="56" y="370" class="h">02  Attempt log</text><text x="56" y="410" class="b">What changed, and what happened?</text><text x="56" y="441" class="b">Observation, cause, next action and why.</text><rect x="34" y="540" width="592" height="175" rx="14" fill="#fff" stroke="#c5d1de"/><text x="56" y="580" class="h">03  Checkpoint</text><text x="56" y="620" class="b">Where can work safely continue?</text><text x="56" y="651" class="b">Last success, revision, environment,</text><text x="56" y="682" class="b">and actual process or resource state.</text><text x="34" y="765" class="b">Before resuming an external operation:</text><text x="34" y="796" class="b">check whether it is running or already took effect.</text></svg>