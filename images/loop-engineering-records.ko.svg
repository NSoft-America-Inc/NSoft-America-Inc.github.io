<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 820" role="img"><rect width="660" height="820" rx="20" fill="#f3f6fa"/><style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#192d42} .h{font-size:25px;font-weight:700}.b{font-size:20px}.s{font-size:17px}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#506782" stroke-width="1.5"/></marker></defs><text x="34" y="48" class="h">세 가지 기록, 세 가지 목적</text><text x="34" y="79" class="s">제안하는 인계·복구 구조</text><rect x="34" y="120" width="592" height="175" rx="14" fill="#fff" stroke="#c5d1de"/><text x="56" y="160" class="h">01  작업 조건</text><text x="56" y="200" class="b">무엇을 달성하려 하는가?</text><text x="56" y="231" class="b">범위, 담당자, 성공 기준, 한도</text><rect x="34" y="330" width="592" height="175" rx="14" fill="#fff" stroke="#c5d1de"/><text x="56" y="370" class="h">02  회차 기록</text><text x="56" y="410" class="b">무엇을 바꿨고 어떤 결과를 얻었는가?</text><text x="56" y="441" class="b">관측, 원인, 다음 행동과 선택 이유</text><rect x="34" y="540" width="592" height="175" rx="14" fill="#fff" stroke="#c5d1de"/><text x="56" y="580" class="h">03  재개 지점</text><text x="56" y="620" class="b">어디서 이어갈 수 있는가?</text><text x="56" y="651" class="b">마지막 성공 단계, 버전, 환경,</text><text x="56" y="682" class="b">실제 프로세스 또는 자원 상태</text><text x="34" y="765" class="b">외부 작업을 다시 시작하기 전에:</text><text x="34" y="796" class="b">아직 실행 중인지, 이미 반영됐는지 확인합니다.</text></svg>