<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 820" role="img"><rect width="660" height="820" rx="20" fill="#f3f6fa"/><style>text{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#192d42} .h{font-size:25px;font-weight:700}.b{font-size:20px}.s{font-size:17px}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#506782" stroke-width="1.5"/></marker></defs><text x="34" y="48" class="h">검증 결과로 다음 행동 결정</text><text x="34" y="79" class="s">제안하는 개발 LOOP</text><rect x="100" y="115" width="460" height="88" rx="12" fill="#fff" stroke="#c5d1de"/><text x="120" y="149" class="h">1  목표 정의</text><text x="120" y="180" class="b">범위 · 담당자 · 성공 기준</text><path d="M330 203 V233" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="240" width="460" height="88" rx="12" fill="#fff" stroke="#c5d1de"/><text x="120" y="274" class="h">2  실행</text><text x="120" y="305" class="b">범위가 명확한 변경 수행</text><path d="M330 328 V358" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="365" width="460" height="88" rx="12" fill="#fff" stroke="#c5d1de"/><text x="120" y="399" class="h">3  검증</text><text x="120" y="430" class="b">특정 버전의 동작 확인</text><path d="M330 453 V483" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="490" width="460" height="88" rx="12" fill="#fff" stroke="#c5d1de"/><text x="120" y="524" class="h">4  판단</text><text x="120" y="555" class="b">검증 결과와 한도에 따라 결정</text><path d="M210 578 V617" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M450 578 V617" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="625" width="275" height="88" rx="12" fill="#e2f3ec" stroke="#c5d1de"/><text x="60" y="659" class="h">완료</text><text x="60" y="690" class="b">필요한 검증 통과</text><rect x="345" y="625" width="275" height="88" rx="12" fill="#fff0d9" stroke="#c5d1de"/><text x="365" y="659" class="h">대기</text><text x="365" y="690" class="b">결정 필요 또는 한도 도달</text><path d="M100 535 H62 V284 H100" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="34" y="770" class="b">수정: 실패 원인을 구분하고 접근 방식을 바꾼 뒤</text><text x="34" y="799" class="b">왼쪽 경로를 따라 실행 단계로 돌아갑니다.</text></svg>