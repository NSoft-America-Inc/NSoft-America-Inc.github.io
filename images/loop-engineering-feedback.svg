<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 820" role="img"><rect width="660" height="820" rx="20" fill="#f3f6fa"/><style>text{font-family:Arial,sans-serif;fill:#192d42} .h{font-size:25px;font-weight:700}.b{font-size:20px}.s{font-size:17px}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#506782" stroke-width="1.5"/></marker></defs><text x="34" y="48" class="h">Evidence chooses the next action</text><text x="34" y="79" class="s">PROPOSED DEVELOPMENT LOOP</text><rect x="100" y="115" width="460" height="88" rx="12" fill="#fff" stroke="#c5d1de"/><text x="120" y="149" class="h">1  Define the target</text><text x="120" y="180" class="b">Scope · owner · success criteria</text><path d="M330 203 V233" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="240" width="460" height="88" rx="12" fill="#fff" stroke="#c5d1de"/><text x="120" y="274" class="h">2  Execute</text><text x="120" y="305" class="b">Make one bounded change</text><path d="M330 328 V358" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="365" width="460" height="88" rx="12" fill="#fff" stroke="#c5d1de"/><text x="120" y="399" class="h">3  Verify</text><text x="120" y="430" class="b">Check behavior at a known revision</text><path d="M330 453 V483" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="100" y="490" width="460" height="88" rx="12" fill="#fff" stroke="#c5d1de"/><text x="120" y="524" class="h">4  Decide</text><text x="120" y="555" class="b">Use the result and applicable limits</text><path d="M210 578 V617" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M450 578 V617" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="625" width="275" height="88" rx="12" fill="#e2f3ec" stroke="#c5d1de"/><text x="60" y="659" class="h">Complete</text><text x="60" y="690" class="b">Required evidence passes</text><rect x="345" y="625" width="275" height="88" rx="12" fill="#fff0d9" stroke="#c5d1de"/><text x="365" y="659" class="h">Pause</text><text x="365" y="690" class="b">Decision or limit reached</text><path d="M100 535 H62 V284 H100" stroke="#506782" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="34" y="770" class="b">Revise: classify the failure, change the approach,</text><text x="34" y="799" class="b">then return to execution via the left-hand path.</text></svg>